<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেজাল্ট ও সার্টিফিকেট পোর্টাল</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: white; padding: 30px; margin-top: 50px; }
        .result-area, .certificate-area { display: none; margin-top: 30px; }
        
        /* Marksheet Styling */
        #marksheet-pdf { padding: 20px; border: 2px solid #333; background: #fff; }
        .status-pass { color: green; font-weight: bold; }
        .status-fail { color: red; font-weight: bold; }

        /* Certificate Styling */
        #certificate-pdf {
            width: 800px; height: 550px; padding: 50px; text-align: center;
            border: 15px solid #1a237e; background: #fff; position: relative; margin: auto;
        }
        .cert-title { font-size: 50px; font-weight: bold; color: #1a237e; }
        .cert-body { font-size: 20px; margin-top: 30px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 main-card">
            <h2 class="text-center mb-4 text-primary">রেজাল্ট ও সার্টিফিকেট পোর্টাল</h2>
            
            <div class="row g-3">
                <div class="col-md-6">
                    <label>পরীক্ষার নাম</label>
                    <select id="examName" class="form-select">
                        <option value="SSC">SSC</option>
                        <option value="HSC">HSC</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label>পরীক্ষার বছর</label>
                    <input type="number" id="examYear" class="form-control" placeholder="2024">
                </div>
                <div class="col-md-12">
                    <label>রেজাল্টের ধরণ</label>
                    <select id="resultType" class="form-select">
                        <option value="individual">Individual Result</option>
                        <option value="detailed">Detailed Marksheet</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <label>রোল নম্বর</label>
                    <input type="text" id="rollNo" class="form-control" placeholder="আপনার রোল দিন">
                </div>
                <div class="col-md-12 mt-4 text-center">
                    <button onclick="searchResult()" class="btn btn-primary px-5">রেজাল্ট দেখুন</button>
                    <button id="certBtn" onclick="showCertificate()" class="btn btn-success px-4" style="display:none;">সার্টিফিকেট ডাউনলোড</button>
                </div>
            </div>

            <div id="resultArea" class="result-area">
                <div id="marksheet-pdf">
                    <h3 class="text-center">একাডেমিক ট্রান্সক্রিপ্ট</h3>
                    <hr>
                    <div id="studentInfo"></div>
                    <table class="table table-bordered mt-3">
                        <thead class="table-light">
                            <tr>
                                <th>বিষয়</th>
                                <th>মার্ক</th>
                                <th>গ্রেড</th>
                                <th>অবস্থা</th>
                            </tr>
                        </thead>
                        <tbody id="marksBody"></tbody>
                    </table>
                    <h4 id="finalGPA" class="text-end"></h4>
                </div>
                <button onclick="downloadPDF('marksheet-pdf')" class="btn btn-outline-dark mt-3">ডাউনলোড মার্কশিট (PDF)</button>
            </div>

            <div id="certificateArea" class="certificate-area">
                <div id="certificate-pdf">
                    <div class="cert-title">প্রশংসাপত্র</div>
                    <div class="cert-body">
                        <p>এই মর্মে প্রত্যয়ন করা যাচ্ছে যে,</p>
                        <h2 id="certName"></h2>
                        <p>রোল নম্বর: <b id="certRoll"></b>, বছর: <b id="certYear"></b></p>
                        <p>অত্র শিক্ষা প্রতিষ্ঠান হতে সফলতার সাথে উত্তীর্ণ হয়েছে।</p>
                    </div>
                </div>
                <button onclick="downloadPDF('certificate-pdf')" class="btn btn-outline-success mt-3">ডাউনলোড সার্টিফিকেট (PDF)</button>
            </div>

        </div>
    </div>
</div>

<script>
    // ডামি ডেটা (আপনি এখানে আপনার Google Sheet CSV fetch করবেন)
    const mockData = [
        { roll: "101", name: "Md. Khairul", class: "10", year: "2024", physics: 85, math: 40, status: "Pass" },
        { roll: "102", name: "Rahim Ali", class: "10", year: "2024", physics: 25, math: 45, status: "Fail" }
    ];

    function calculateGrade(marks) {
        if (marks >= 80) return "A+";
        if (marks >= 70) return "A";
        if (marks >= 33) return "Pass";
        return "F";
    }

    function searchResult() {
        const roll = document.getElementById('rollNo').value;
        const year = document.getElementById('examYear').value;
        const student = mockData.find(s => s.roll === roll && s.year === year);

        if (student) {
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('studentInfo').innerHTML = `
                <p><b>নাম:</b> ${student.name} | <b>শ্রেণি:</b> ${student.class} | <b>রোল:</b> ${student.roll}</p>
            `;

            // মার্কশিট টেবিল তৈরি
            let marksHtml = `
                <tr><td>Physics</td><td>${student.physics}</td><td>${calculateGrade(student.physics)}</td><td class="${student.physics >= 33 ? 'status-pass':'status-fail'}">${student.physics >= 33 ? 'Pass':'Fail'}</td></tr>
                <tr><td>Math</td><td>${student.math}</td><td>${calculateGrade(student.math)}</td><td class="${student.math >= 33 ? 'status-pass':'status-fail'}">${student.math >= 33 ? 'Pass':'Fail'}</td></tr>
            `;
            document.getElementById('marksBody').innerHTML = marksHtml;

            // যদি পাস হয় তবে সার্টিফিকেট বাটন দেখাবে
            if (student.status === "Pass" && student.physics >= 33 && student.math >= 33) {
                document.getElementById('certBtn').style.display = 'inline-block';
                // সার্টিফিকেট ডেটা সেট
                document.getElementById('certName').innerText = student.name;
                document.getElementById('certRoll').innerText = student.roll;
                document.getElementById('certYear').innerText = student.year;
            } else {
                document.getElementById('certBtn').style.display = 'none';
            }
        } else {
            alert("দুঃখিত, কোনো রেজাল্ট পাওয়া যায়নি!");
        }
    }

    function showCertificate() {
        document.getElementById('resultArea').style.display = 'none';
        document.getElementById('certificateArea').style.display = 'block';
    }

    function downloadPDF(elementId) {
        const element = document.getElementById(elementId);
        html2pdf().from(element).save();
    }
</script>

</body>
</html>
