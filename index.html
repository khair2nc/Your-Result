<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verified Certificate Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .main-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-top: 20px; }
        
        /* Professional Certificate Design */
        #certificate-pdf {
            width: 900px; height: 630px; padding: 50px; background: #fff;
            border: 15px solid #1a237e; outline: 5px solid #c5a059; outline-offset: -10px;
            position: relative; margin: auto; color: #333; box-sizing: border-box;
        }
        .cert-header { color: #1a237e; font-size: 42px; font-weight: bold; text-align: center; margin-bottom: 0; }
        .cert-sub { font-size: 18px; text-align: center; color: #777; letter-spacing: 2px; margin-bottom: 40px; }
        .cert-body { font-size: 19px; line-height: 1.8; margin: 0 50px; }
        .cert-name { font-family: 'Times New Roman', serif; font-size: 32px; font-weight: bold; color: #1a237e; border-bottom: 2px solid #ccc; }
        
        /* QR Code & Signatures */
        .cert-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 60px; padding: 0 50px; }
        #qrcode { padding: 5px; border: 1px solid #eee; background: #fff; }
        .signature-box { text-align: center; border-top: 2px solid #333; width: 180px; padding-top: 5px; font-weight: bold; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container pb-5">
    <div class="main-card">
        <h2 class="text-center text-primary mb-4">Online Verification System</h2>
        
        <div class="row g-3">
            <div class="col-md-8">
                <input type="text" id="rollNo" class="form-control form-control-lg" placeholder="Enter Roll Number (e.g. 101)">
            </div>
            <div class="col-md-4">
                <button onclick="searchResult()" class="btn btn-primary btn-lg w-100">Verify & Search</button>
            </div>
        </div>

        <div id="resultSection" class="mt-5 hidden">
            <div class="p-4 border rounded bg-light">
                <h4 class="mb-3">Academic Transcript</h4>
                <div id="stDetails" class="mb-3"></div>
                <table class="table table-hover table-bordered bg-white">
                    <thead class="table-dark">
                        <tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>
                    </thead>
                    <tbody id="marksTable"></tbody>
                </table>
                <div class="text-center">
                    <button id="certBtn" onclick="generateAndShowCert()" class="btn btn-success btn-lg hidden">Preview & Download Certificate</button>
                </div>
            </div>
        </div>

        <div id="certSection" class="mt-5 hidden text-center">
            <div id="certificate-pdf">
                <div class="cert-header" id="instName">INSTITUTION NAME</div>
                <div class="cert-sub">CERTIFICATE OF ACHIEVEMENT</div>
                
                <div class="cert-body text-start">
                    This is to certify that <span class="cert-name" id="cName">...</span> <br>
                    Son/Daughter of <b id="cFather">...</b> and <b id="cMother">...</b> <br>
                    Roll No: <b id="cRoll">...</b>, DOB: <b id="cDOB">...</b> <br>
                    has passed the <b id="cExam">...</b> in <b id="cYear">...</b> 
                    obtaining <b id="cResult">...</b>.
                </div>

                <div class="cert-footer">
                    <div id="qrcode"></div> <div class="signature-box">Principal Signature</div>
                </div>
            </div>
            <button onclick="downloadPDF()" class="btn btn-dark mt-4 px-5">Download Verified PDF</button>
        </div>
    </div>
</div>

<script>
    // Sample Student Data
    const students = [
        {
            roll: "101", name: "Md. Khairul Sheikh", father: "Abdul Sheikh", mother: "Khatun Begum",
            dob: "12-05-2008", inst: "Faridpur Public School", exam: "Annual Exam", year: "2026",
            result: "GPA 5.00", status: "Pass",
            subjects: [{s:"English", m:85, g:"A+"}, {s:"Math", m:92, g:"A+"}]
        }
    ];

    let currentStudent = null;

    function searchResult() {
        const roll = document.getElementById('rollNo').value;
        currentStudent = students.find(s => s.roll === roll);
        
        if (currentStudent) {
            document.getElementById('resultSection').classList.remove('hidden');
            document.getElementById('stDetails').innerHTML = `<h5>Student: ${currentStudent.name}</h5>`;
            
            let html = "";
            currentStudent.subjects.forEach(x => {
                html += `<tr><td>${x.s}</td><td>${x.m}</td><td>${x.g}</td></tr>`;
            });
            document.getElementById('marksTable').innerHTML = html;

            if (currentStudent.status === "Pass") {
                document.getElementById('certBtn').classList.remove('hidden');
            } else {
                document.getElementById('certBtn').classList.add('hidden');
            }
        } else {
            alert("No record found!");
        }
    }

    function generateAndShowCert() {
        document.getElementById('certSection').classList.remove('hidden');
        
        // Fill Certificate Data
        document.getElementById('instName').innerText = currentStudent.inst;
        document.getElementById('cName').innerText = currentStudent.name;
        document.getElementById('cFather').innerText = currentStudent.father;
        document.getElementById('cMother').innerText = currentStudent.mother;
        document.getElementById('cRoll').innerText = currentStudent.roll;
        document.getElementById('cDOB').innerText = currentStudent.dob;
        document.getElementById('cExam').innerText = currentStudent.exam;
        document.getElementById('cYear').innerText = currentStudent.year;
        document.getElementById('cResult').innerText = currentStudent.result;

        // Generate QR Code
        const qrContainer = document.getElementById("qrcode");
        qrContainer.innerHTML = ""; // Clear old QR
        
        // ভেরিফিকেশন ইউআরএল (এখানে আপনার গিটহাব পেজের লিঙ্ক দিন)
        const verifyURL = `https://${window.location.hostname}/verify?roll=${currentStudent.roll}`;
        
        new QRCode(qrContainer, {
            text: verifyURL,
            width: 90,
            height: 90,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        window.scrollTo(0, document.body.scrollHeight);
    }

    function downloadPDF() {
        const element = document.getElementById('certificate-pdf');
        const opt = {
            margin: 0,
            filename: `Certificate_${currentStudent.roll}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
        };
        html2pdf().set(opt).from(element).save();
    }
</script>

</body>
</html>
