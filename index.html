<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Portal with QR Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .main-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); margin-top: 30px; }
        
        /* Marksheet Styling */
        .status-pass { color: green; font-weight: bold; }
        .status-fail { color: red; font-weight: bold; }
        .hidden { display: none; }

        /* Certificate Styling - Original Design with QR */
        #certificate-pdf {
            width: 850px; height: 600px; padding: 50px; background: #fff;
            border: 20px double #1a237e; position: relative; margin: auto;
            color: #333; text-align: center; box-sizing: border-box;
        }
        .cert-header { color: #1a237e; font-size: 38px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .cert-sub { font-size: 18px; font-style: italic; color: #555; margin-bottom: 30px; }
        .cert-body { font-size: 18px; line-height: 1.8; text-align: left; margin: 0 40px; }
        .cert-name { font-family: 'Georgia', serif; font-size: 28px; font-weight: bold; border-bottom: 1px solid #333; display: inline-block; padding: 0 10px; }
        
        /* Footer: QR Code and Signature */
        .cert-footer {
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 40px;
        }
        #qrcode { background: #fff; padding: 5px; border: 1px solid #ddd; }
        .signature { border-top: 2px solid #333; width: 200px; text-align: center; font-weight: bold; padding-top: 5px; }
    </style>
</head>
<body>

<div class="container pb-5">
    <div class="main-card">
        <h2 class="text-center text-primary mb-4">Academic Portal</h2>
        
        <div class="row g-3">
            <div class="col-md-6">
                <label>Roll Number</label>
                <input type="text" id="rollNo" class="form-control" placeholder="Enter Roll (e.g. 101)">
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <button onclick="searchResult()" class="btn btn-primary w-100">Search Result</button>
            </div>
        </div>

        <div id="resultSection" class="mt-5 hidden">
            <h4 class="text-center">Student Marksheet</h4>
            <div id="stDetails" class="mb-3"></div>
            <table class="table table-bordered">
                <thead class="table-dark">
                    <tr><th>Subject</th><th>Marks</th><th>Grade</th><th>Status</th></tr>
                </thead>
                <tbody id="marksTable"></tbody>
            </table>
            <div class="text-end">
                <button id="certBtn" onclick="generateAndShowCert()" class="btn btn-success hidden">Generate Certificate</button>
            </div>
        </div>

        <div id="certSection" class="mt-5 hidden">
            <div id="certificate-pdf">
                <div class="cert-header" id="instName">INSTITUTION NAME</div>
                <div class="cert-sub">Certificate of Achievement</div>
                
                <div class="cert-body">
                    This is to certify that <span class="cert-name" id="cName">...</span> <br>
                    Son/Daughter of <b id="cFather">...</b> and <b id="cMother">...</b> <br>
                    Roll No: <b id="cRoll">...</b>, Date of Birth: <b id="cDOB">...</b> <br>
                    has successfully passed the <b id="cExam">...</b> in <b id="cYear">...</b> 
                    with Result: <b id="cResult">...</b>.
                </div>

                <div class="cert-footer">
                    <div id="qrcode"></div> <div class="signature">Headmaster Signature</div>
                </div>
            </div>
            <div class="text-center mt-3">
                <button onclick="downloadPDF()" class="btn btn-dark">Download PDF</button>
            </div>
        </div>
    </div>
</div>

<script>
    const students = [
        {
            roll: "101", name: "Md. Khairul Sheikh", father: "Abdul Sheikh", mother: "Khatun Begum",
            dob: "12-05-2008", inst: "Faridpur High School", exam: "Annual Exam", year: "2026",
            result: "GPA 5.00", status: "Pass",
            subjects: [
                {s: "English", m: 85, g: "A+"},
                {s: "Mathematics", m: 92, g: "A+"}
            ]
        }
    ];

    let activeStudent = null;

    function searchResult() {
        const roll = document.getElementById('rollNo').value;
        activeStudent = students.find(s => s.roll === roll);
        
        if (activeStudent) {
            document.getElementById('resultSection').classList.remove('hidden');
            document.getElementById('stDetails').innerHTML = `<b>Student Name:</b> ${activeStudent.name}`;
            
            let html = "";
            activeStudent.subjects.forEach(item => {
                html += `<tr><td>${item.s}</td><td>${item.m}</td><td>${item.g}</td><td class="status-pass">Pass</td></tr>`;
            });
            document.getElementById('marksTable').innerHTML = html;

            if (activeStudent.status === "Pass") {
                document.getElementById('certBtn').classList.remove('hidden');
            }
        } else {
            alert("Record not found!");
        }
    }

    function generateAndShowCert() {
        document.getElementById('certSection').classList.remove('hidden');
        
        // Fill Data
        document.getElementById('instName').innerText = activeStudent.inst;
        document.getElementById('cName').innerText = activeStudent.name;
        document.getElementById('cFather').innerText = activeStudent.father;
        document.getElementById('cMother').innerText = activeStudent.mother;
        document.getElementById('cRoll').innerText = activeStudent.roll;
        document.getElementById('cDOB').innerText = activeStudent.dob;
        document.getElementById('cExam').innerText = activeStudent.exam;
        document.getElementById('cYear').innerText = activeStudent.year;
        document.getElementById('cResult').innerText = activeStudent.result;

        // Generate QR Code
        const qrDiv = document.getElementById("qrcode");
        qrDiv.innerHTML = ""; // Clear existing
        const verifyLink = window.location.href + "?verify=" + activeStudent.roll;
        
        new QRCode(qrDiv, {
            text: verifyLink,
            width: 80,
            height: 80
        });

        window.scrollTo(0, document.body.scrollHeight);
    }

    function downloadPDF() {
        const element = document.getElementById('certificate-pdf');
        html2pdf().from(element).set({
            margin: 0,
            filename: 'Certificate.pdf',
            jsPDF: { unit: 'in', format: 'a4', orientation: 'landscape' }
        }).save();
    }
</script>

</body>
</html>
